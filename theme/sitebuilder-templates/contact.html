<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #333; }
.wrap { max-width: 700px; margin: 0 auto; padding: 60px 20px; }
h1 { margin-bottom: 8px; }
.info { color: #666; margin-bottom: 30px; }
label { display: block; font-weight: bold; margin-bottom: 6px; }
input, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 18px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
button { padding: 12px 30px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Contact Us</h1>
  <p class="info">Email: info@example.com &middot; Phone: (555) 123-4567</p>
  <form>
    <label for="name">Name</label>
    <input type="text" id="name" name="name">
    <label for="email">Email</label>
    <input type="email" id="email" name="email">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5"></textarea>
    <button type="submit">Send Message</button>
  </form>
</div>
</body>
</html>
