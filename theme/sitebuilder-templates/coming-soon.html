<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #fff; background: linear-gradient(135deg,#1a1a2e,#16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.wrap { max-width: 600px; margin: 0 auto; padding: 60px 20px; text-align: center; }
h1 { font-size: 2.5rem; margin-bottom: 10px; }
p { color: #aaa; font-size: 1.1rem; margin-bottom: 30px; }
.signup { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
.signup input { flex: 1; padding: 12px; border-radius: 6px; border: none; }
.signup button { padding: 12px 24px; background: #667eea; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>We're Launching Soon</h1>
  <p>Sign up to be notified when we go live.</p>
  <form class="signup">
    <input type="email" placeholder="you@example.com" required>
    <button type="submit">Notify Me</button>
  </form>
</div>
</body>
</html>
