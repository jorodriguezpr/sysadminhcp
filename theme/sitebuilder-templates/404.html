<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found</title>
<style>
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
.wrap { padding: 20px; }
.code { font-size: 6rem; font-weight: bold; color: #667eea; margin: 0; line-height: 1; }
h1 { margin: 10px 0; }
p { color: #777; margin-bottom: 25px; }
a.home { display: inline-block; padding: 12px 30px; background: #667eea; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a class="home" href="/">Back to Home</a>
</div>
</body>
</html>
