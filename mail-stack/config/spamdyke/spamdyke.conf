# SysAdminHCP mail-stack — spamdyke config for port 25 (public MX) only. Port 587
# (authenticated submission) deliberately does NOT run spamdyke — IP-reputation/RBL checks
# would incorrectly reject legitimate senders on residential/mobile IPs where SMTP AUTH
# itself is the real gate.
graylist-level=none
greeting-delay-secs=6
max-recipients=50
reject-empty-rdns
reject-unresolvable-rdns
reject-sender=no-mx
dns-blacklist-entry=bl.rbl-dns.com

# TLS 1.2-only cipher list — REQUIRED, not optional. spamdyke's own compiled-in default
# cipher list includes TLS 1.3 suite names passed to OpenSSL's legacy
# SSL_CTX_set_cipher_list() API, which OpenSSL 3.2+ (EL10's default, and increasingly common
# elsewhere) rejects outright — "unable to set SSL/TLS cipher list" on every connection,
# silently breaking STARTTLS. Confirmed live; this is not a hypothetical.
tls-cipher-list=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
